<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Gestión de Vehículos - FlashWash</title>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="img/logo.png" alt="FlashWash" class="w-10 h-10">
                <h1 class="text-xl font-black text-blue-600">Flashwash</h1>
            </div>
            <nav class="flex gap-6 font-semibold text-gray-600">
                <a href="dashboard.html" class="hover:text-blue-600">Inicio</a>
                <a href="vehiculos.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Mis Vehículos</a>
            </nav>
            <button id="btnLogout" class="text-red-500 hover:text-red-700 flex items-center gap-2">
                <span class="material-symbols-outlined">logout</span> Salir
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="md:col-span-1">
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-600">directions_car</span>
                    Registrar Vehículo
                </h2>
                
                <form id="formVehiculo" class="space-y-4">
                    <input type="hidden" id="vehiculoId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Marca y Modelo</label>
                        <input type="text" id="marcaModelo" required placeholder="Ej. Toyota Corolla" class="mt-1 w-full p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Placa</label>
                        <input type="text" id="placa" required placeholder="ABC-123" class="mt-1 w-full p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 uppercase">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipo</label>
                        <select id="tipoVehiculo" class="mt-1 w-full p-2 border rounded-lg">
                            <option value="Automóvil">Automóvil</option>
                            <option value="Camioneta">Camioneta / SUV</option>
                            <option value="Moto">Motocicleta</option>
                        </select>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">Guardar</button>
                        <button type="button" id="btnLimpiar" class="w-full bg-gray-200 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-300 transition">Limpiar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="md:col-span-2">
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Mi Garaje</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-3">Tipo</th>
                                <th class="p-3">Marca y Modelo</th>
                                <th class="p-3">Placa</th>
                                <th class="p-3 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVehiculos" class="text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/vehiculos_crud.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
